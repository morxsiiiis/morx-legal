<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Official Terms of Service and Privacy Policy for the Morx Discord bot.">
  <title>Morx Bot — Legal Information</title>
  <style>
    :root { color-scheme: dark; --bg: #0b0b10; --panel: #171720; --pink: #ff6fae; --text: #f7f4f8; --muted: #c5bdc9; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at top, #32172b 0, var(--bg) 52%); color: var(--text); font-family: Arial, Helvetica, sans-serif; }
    main { width: min(680px, 100%); padding: clamp(24px, 6vw, 48px); border: 1px solid #493044; border-radius: 22px; background: rgba(23, 23, 32, .94); box-shadow: 0 20px 70px #0008; text-align: center; }
    .mark { display: inline-grid; place-items: center; width: 68px; height: 68px; border-radius: 20px; background: #33202e; color: var(--pink); font-size: 30px; font-weight: 800; }
    h1 { margin: 20px 0 10px; font-size: clamp(2rem, 6vw, 3rem); }
    p { color: var(--muted); line-height: 1.65; }
    .links { display: grid; gap: 12px; margin-top: 28px; }
    a { display: block; padding: 15px 18px; border-radius: 12px; border: 1px solid #604056; color: var(--text); background: #251b28; text-decoration: none; font-weight: 700; }
    a:hover, a:focus { border-color: var(--pink); background: #382238; }
    footer { margin-top: 28px; color: #9f95a3; font-size: .85rem; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">M</div>
    <h1>Morx Bot</h1>
    <p>Official legal information for the Morx Discord bot. Choose a document below to read the applicable terms and privacy practices.</p>
    <nav class="links" aria-label="Legal documents">
      <a href="./terms-of-service.html">Terms of Service</a>
      <a href="./privacy-policy.html">Privacy Policy</a>
    </nav>
    <footer>Morx Bot · Legal information</footer>
  </main>
</body>
</html>
